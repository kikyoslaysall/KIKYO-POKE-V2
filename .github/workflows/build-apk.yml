name: Build KIKYO MD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build KIKYO Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          DIR=$(dirname "$WRAPPER")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" \
            -type f -name '*.apk' \
            -path '*/build/outputs/apk/*' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIKYO-MD-ANDROID-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
