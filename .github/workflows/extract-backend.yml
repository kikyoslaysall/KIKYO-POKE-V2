name: Extract KIKYO Backend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract backend ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "KIKYO_MD_BACKEND_UPDATED.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Backend ZIP not found!"
            exit 1
          fi

          mkdir -p backend
          unzip -o "$ZIP" -d backend

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "Extract KIKYO backend"
          git push
